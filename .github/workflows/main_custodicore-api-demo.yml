# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - custodicore-api-demo

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Composer configuration
        working-directory: Custodicore-Web
        run: composer validate --no-check-publish

      - name: Install production Composer dependencies
        working-directory: Custodicore-Web
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader --no-interaction

      - name: Install frontend dependencies
        working-directory: Custodicore-Web
        run: npm ci

      - name: Build frontend
        working-directory: Custodicore-Web
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: |
            Custodicore-Web
            !Custodicore-Web/node_modules
            !Custodicore-Web/.env
            !Custodicore-Web/custodicore-backup.sql

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'custodicore-api-demo'
          slot-name: 'Production'
          package: .
