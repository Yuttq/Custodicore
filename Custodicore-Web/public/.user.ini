; PHP-FPM upload limits on Azure App Service (read from the script's folder).
; Documents may be up to 10 MB each (VisitorApiController::DOCUMENT_FILE_RULES)
; and registration sends several files in one request. Keep post_max_size in
; line with client_max_body_size in ../default. Same values as deploy/server-setup.sh.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 20
